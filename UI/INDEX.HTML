<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>75% Ledger — Attendance Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E7E5DA;
    --paper-line: #C9C6B5;
    --ink: #20302B;
    --ink-soft: #4B5C55;
    --brick: #A73E33;
    --brick-soft: #C9847B;
    --stamp-green: #2F6B4F;
    --brass: #A9822C;
    --card: #F1EFE5;
    --shadow: rgba(32,48,43,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .wrap{max-width:920px; margin:0 auto; padding:28px 20px 0;}

  /* HEADER */
  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom:3px double var(--ink);
    padding-bottom:14px; margin-bottom:6px; flex-wrap:wrap; gap:10px;
  }
  .title{
    font-family:'Roboto Slab', serif;
    font-weight:700; font-size:1.7rem; letter-spacing:0.5px;
    display:flex; align-items:baseline; gap:10px;
  }
  .title .num{ color:var(--brick); }
  .subtitle{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:1.5px;
    margin-top:2px;
  }
  .overall-chip{
    font-family:'IBM Plex Mono', monospace;
    background:var(--card); border:1px solid var(--ink); border-radius:3px;
    padding:8px 12px; text-align:center; min-width:110px;
  }
  .overall-chip .pct{ font-size:1.3rem; font-weight:600; }
  .overall-chip .lab{ font-size:0.6rem; letter-spacing:1px; color:var(--ink-soft); text-transform:uppercase;}

  /* BINDER TABS — years */
  .years{
    display:flex; gap:6px; margin:18px 0 0; flex-wrap:wrap;
  }
  .year-tab{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; font-weight:500;
    padding:8px 14px 7px; cursor:pointer; user-select:none;
    background:var(--paper); border:1px solid var(--ink); border-bottom:none;
    border-radius:6px 6px 0 0; color:var(--ink-soft); letter-spacing:0.5px;
    transform:translateY(3px); transition:transform .15s ease, background .15s ease;
  }
  .year-tab.active{
    background:var(--card); color:var(--ink); font-weight:600; transform:translateY(0);
    box-shadow:0 -2px 6px var(--shadow);
  }
  .year-tab:hover:not(.active){ transform:translateY(1px); }

  .sem-panel{
    background:var(--card); border:1px solid var(--ink); border-radius:0 6px 6px 6px;
    padding:20px; box-shadow:0 2px 10px var(--shadow); position:relative;
  }

  .sems{ display:flex; gap:8px; margin-bottom:16px; }
  .sem-tab{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem;
    padding:6px 12px; border:1px solid var(--ink-soft); border-radius:20px;
    cursor:pointer; color:var(--ink-soft); background:transparent; letter-spacing:0.5px;
  }
  .sem-tab.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .sem-header{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
  .sem-name{ font-family:'Roboto Slab', serif; font-size:1.15rem; font-weight:600;}
  .stamp{
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:0.78rem;
    letter-spacing:2px; text-transform:uppercase; padding:6px 14px;
    border:2.5px solid var(--stamp-green); color:var(--stamp-green);
    border-radius:4px; transform:rotate(-4deg); opacity:0.9;
  }
  .stamp.risk{ border-color:var(--brick); color:var(--brick); }
  .stamp.empty{ border-color:var(--ink-soft); color:var(--ink-soft); }

  /* LEDGER TABLE */
  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left; font-family:'IBM Plex Mono', monospace; font-size:0.65rem;
    text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft);
    border-bottom:1.5px solid var(--ink); padding:0 8px 8px;
  }
  tbody td{
    padding:10px 8px; border-bottom:1px solid var(--paper-line); vertical-align:middle;
  }
  tbody tr:hover{ background:rgba(169,130,44,0.06); }
  .subj-input{
    width:100%; border:none; background:transparent; font-family:'IBM Plex Sans', sans-serif;
    font-size:0.9rem; color:var(--ink); padding:4px 2px; border-bottom:1px dashed transparent;
  }
  .subj-input:focus{ outline:none; border-bottom:1px dashed var(--brass); }
  .num-input{
    width:60px; border:1px solid var(--paper-line); background:#fff; border-radius:3px;
    font-family:'IBM Plex Mono', monospace; font-size:0.85rem; padding:5px 6px; text-align:center; color:var(--ink);
  }
  .num-input:focus{ outline:none; border-color:var(--brass); }
  .pct-cell{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:0.92rem; white-space:nowrap;}
  .pct-cell.safe{ color:var(--stamp-green); }
  .pct-cell.risk{ color:var(--brick); }
  .margin-note{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; white-space:nowrap;
  }
  .margin-note.safe{ color:var(--stamp-green); }
  .margin-note.risk{ color:var(--brick); font-weight:600; }
  .gauge{
    width:70px; height:6px; background:var(--paper-line); border-radius:3px; overflow:hidden;
    position:relative; margin-top:5px;
  }
  .gauge-fill{ height:100%; border-radius:3px; }
  .gauge-mark{
    position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink); left:75%;
  }
  .del-btn{
    background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:1rem;
    padding:2px 6px; border-radius:3px;
  }
  .del-btn:hover{ color:var(--brick); background:rgba(167,62,51,0.1); }

  .add-row{
    margin-top:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  .add-btn{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; font-weight:600;
    background:var(--ink); color:var(--paper); border:none; padding:9px 16px;
    border-radius:4px; cursor:pointer; letter-spacing:0.5px;
  }
  .add-btn:hover{ background:var(--brick); }
  .add-btn.ghost{
    background:transparent; color:var(--ink); border:1px solid var(--ink);
  }
  .add-btn.ghost:hover{ background:var(--card); border-color:var(--brass); color:var(--brass); }

  .empty-note{
    font-family:'IBM Plex Mono', monospace; font-size:0.8rem; color:var(--ink-soft);
    padding:20px 4px; text-align:center; border:1px dashed var(--paper-line); border-radius:4px;
  }

  /* DASHBOARD */
  .dash-toggle{
    display:flex; justify-content:flex-end; margin:16px 0 0;
  }
  .dash-toggle button{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; background:none;
    border:1px solid var(--ink-soft); color:var(--ink-soft); padding:6px 12px;
    border-radius:20px; cursor:pointer; letter-spacing:0.5px;
  }
  .dash-toggle button:hover{ border-color:var(--brass); color:var(--brass); }

  .passbook{
    margin-top:14px; background:var(--card); border:1px solid var(--ink); border-radius:6px;
    padding:22px; box-shadow:0 2px 10px var(--shadow);
  }
  .passbook h2{
    font-family:'Roboto Slab', serif; font-size:1.1rem; margin:0 0 4px;
  }
  .passbook .pb-sub{
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:1px; margin-bottom:16px;
  }
  .tiles{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:10px; }
  .tile{
    border:1px solid var(--paper-line); border-radius:5px; padding:12px 14px; background:var(--paper);
    position:relative; overflow:hidden;
  }
  .tile .t-name{ font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px;}
  .tile .t-pct{ font-family:'Roboto Slab', serif; font-weight:700; font-size:1.5rem; margin-top:4px;}
  .tile .t-pct.safe{ color:var(--stamp-green); }
  .tile .t-pct.risk{ color:var(--brick); }
  .tile .t-pct.dim{ color:var(--ink-soft); font-size:1.1rem; }
  .tile .t-bar{ height:4px; background:var(--paper-line); border-radius:2px; margin-top:8px; overflow:hidden;}
  .tile .t-bar-fill{ height:100%; }

  footer{
    max-width:920px; margin:26px auto 0; padding:0 20px; text-align:center;
    font-family:'IBM Plex Mono', monospace; font-size:0.65rem; color:var(--ink-soft); letter-spacing:0.5px;
  }
  @media (max-width:600px){
    .title{ font-size:1.3rem; }
    thead th:nth-child(1), tbody td:nth-child(1){ min-width:110px; }
    .gauge{ width:50px; }
  }
  :focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="title"><span class="num">75%</span> Ledger</div>
      <div class="subtitle">Attendance Register · 4 Years · 8 Semesters</div>
    </div>
    <div class="overall-chip">
      <div class="pct" id="headerOverall">—</div>
      <div class="lab">Overall %</div>
    </div>
  </header>

  <div class="years" id="yearTabs"></div>
  <div class="sem-panel" id="semPanel"></div>

  <div class="dash-toggle">
    <button id="dashBtn">View 4-year dashboard ▾</button>
  </div>
  <div class="passbook" id="passbook" style="display:none;"></div>
</div>

<footer>Saved automatically in your browser · no login, no server</footer>

<script>
const SEM_LABELS = [
  "Year 1 · Sem 1","Year 1 · Sem 2",
  "Year 2 · Sem 1","Year 2 · Sem 2",
  "Year 3 · Sem 1","Year 3 · Sem 2",
  "Year 4 · Sem 1","Year 4 · Sem 2"
];
const STORAGE_KEY = "attendance-ledger-data";
let data = {}; // { sem_1: {subjects:[{id,name,held,attended}]}, ... }
let currentYear = 1;
let currentSem = 1; // 1 or 2 within year
let dashOpen = false;
let saveTimer = null;

function semKey(n){ return "sem_" + n; }
function semIndexFromYearSem(year, semInYear){ return (year-1)*2 + semInYear; }

function emptySem(){ return { subjects: [] }; }

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      data = JSON.parse(res.value);
    }
  }catch(e){ /* no saved data yet */ }
  for(let i=1;i<=8;i++){
    if(!data[semKey(i)]) data[semKey(i)] = emptySem();
  }
  render();
}

function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(data), false); }
    catch(e){ console.error("Save failed", e); }
  }, 300);
}

function calcPct(subj){
  if(!subj.held || subj.held <= 0) return null;
  return (subj.attended / subj.held) * 100;
}

function marginInfo(subj){
  const held = subj.held || 0, att = subj.attended || 0;
  if(held <= 0) return {text:"— add held classes", safe:true};
  const pct = (att/held)*100;
  if(pct >= 75){
    const canSkip = Math.floor(att/0.75 - held);
    return { text: canSkip > 0 ? `✓ can skip ${canSkip} more` : "✓ at the line", safe:true };
  } else {
    const needed = Math.ceil((0.75*held - att) / 0.25);
    return { text: `⚠ attend next ${needed} straight`, safe:false };
  }
}

function semOverall(sem){
  let held=0, att=0;
  sem.subjects.forEach(s=>{ held += (s.held||0); att += (s.attended||0); });
  if(held<=0) return null;
  return (att/held)*100;
}

function overallAll(){
  let held=0, att=0;
  for(let i=1;i<=8;i++){
    data[semKey(i)].subjects.forEach(s=>{ held += (s.held||0); att += (s.attended||0); });
  }
  if(held<=0) return null;
  return (att/held)*100;
}

function uid(){ return 'id'+Math.random().toString(36).slice(2,9); }

function render(){
  renderYearTabs();
  renderSemPanel();
  renderHeader();
  if(dashOpen) renderDashboard();
}

function renderHeader(){
  const o = overallAll();
  document.getElementById('headerOverall').textContent = o===null ? "—" : o.toFixed(1)+"%";
  document.getElementById('headerOverall').style.color = o===null ? "var(--ink-soft)" : (o>=75 ? "var(--stamp-green)" : "var(--brick)");
}

function renderYearTabs(){
  const el = document.getElementById('yearTabs');
  el.innerHTML = "";
  for(let y=1;y<=4;y++){
    const tab = document.createElement('div');
    tab.className = 'year-tab' + (y===currentYear ? ' active':'');
    tab.textContent = 'Year ' + y;
    tab.onclick = () => { currentYear = y; currentSem = 1; render(); };
    el.appendChild(tab);
  }
}

function renderSemPanel(){
  const panel = document.getElementById('semPanel');
  const idx = semIndexFromYearSem(currentYear, currentSem);
  const sem = data[semKey(idx)];
  const overall = semOverall(sem);

  panel.innerHTML = "";

  const semsRow = document.createElement('div');
  semsRow.className = 'sems';
  [1,2].forEach(s=>{
    const t = document.createElement('div');
    t.className = 'sem-tab' + (s===currentSem ? ' active':'');
    t.textContent = 'Semester ' + s;
    t.onclick = () => { currentSem = s; render(); };
    semsRow.appendChild(t);
  });
  panel.appendChild(semsRow);

  const headRow = document.createElement('div');
  headRow.className = 'sem-header';
  const nameEl = document.createElement('div');
  nameEl.className = 'sem-name';
  nameEl.textContent = SEM_LABELS[idx-1];
  headRow.appendChild(nameEl);

  const stamp = document.createElement('div');
  if(overall === null){
    stamp.className = 'stamp empty';
    stamp.textContent = 'No entries';
  } else if(overall >= 75){
    stamp.className = 'stamp';
    stamp.textContent = 'Safe · ' + overall.toFixed(1) + '%';
  } else {
    stamp.className = 'stamp risk';
    stamp.textContent = 'Risk · ' + overall.toFixed(1) + '%';
  }
  headRow.appendChild(stamp);
  panel.appendChild(headRow);

  if(sem.subjects.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-note';
    empty.textContent = 'No subjects added for this semester yet. Add your first subject below.';
    panel.appendChild(empty);
  } else {
    const table = document.createElement('table');
    table.innerHTML = `<thead><tr>
      <th>Subject</th><th>Held</th><th>Attended</th><th>%</th><th>Margin</th><th></th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');

    sem.subjects.forEach(subj=>{
      const tr = document.createElement('tr');
      const pct = calcPct(subj);
      const mi = marginInfo(subj);
      const pctClass = pct===null ? '' : (pct>=75 ? 'safe':'risk');

      tr.innerHTML = `
        <td><input class="subj-input" value="${escapeHtml(subj.name)}" placeholder="Subject name" /></td>
        <td><input class="num-input" type="number" min="0" value="${subj.held ?? ''}" placeholder="0" /></td>
        <td><input class="num-input" type="number" min="0" value="${subj.attended ?? ''}" placeholder="0" /></td>
        <td class="pct-cell ${pctClass}">${pct===null ? '—' : pct.toFixed(1)+'%'}</td>
        <td>
          <div class="margin-note ${mi.safe ? 'safe':'risk'}">${mi.text}</div>
          <div class="gauge"><div class="gauge-mark"></div><div class="gauge-fill" style="width:${pct===null?0:Math.min(pct,100)}%; background:${pct===null?'var(--paper-line)':(pct>=75?'var(--stamp-green)':'var(--brick)')};"></div></div>
        </td>
        <td><button class="del-btn" title="Remove subject">✕</button></td>
      `;

      const [nameIn, heldIn, attIn] = tr.querySelectorAll('input');
      nameIn.oninput = e => { subj.name = e.target.value; queueSave(); };
      heldIn.oninput = e => { subj.held = e.target.value===''? 0 : Math.max(0, parseInt(e.target.value)||0); syncAttended(subj); queueSave(); render(); };
      attIn.oninput = e => { subj.attended = e.target.value===''? 0 : Math.max(0, parseInt(e.target.value)||0); syncAttended(subj); queueSave(); render(); };
      tr.querySelector('.del-btn').onclick = () => {
        sem.subjects = sem.subjects.filter(s=>s.id!==subj.id);
        queueSave(); render();
      };
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    panel.appendChild(table);
  }

  const addRow = document.createElement('div');
  addRow.className = 'add-row';
  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.textContent = '+ Add subject';
  addBtn.onclick = () => {
    sem.subjects.push({ id: uid(), name:'', held:0, attended:0 });
    queueSave(); render();
    setTimeout(()=>{ const inputs = document.querySelectorAll('.subj-input'); if(inputs.length) inputs[inputs.length-1].focus(); }, 0);
  };
  addRow.appendChild(addBtn);
  panel.appendChild(addRow);
}

function syncAttended(subj){
  if(subj.attended > subj.held) subj.attended = subj.held;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function renderDashboard(){
  const pb = document.getElementById('passbook');
  pb.style.display = 'block';
  const overall = overallAll();
  let html = `<h2>4-Year Passbook</h2>
    <div class="pb-sub">Overall attendance: ${overall===null ? '—' : overall.toFixed(1)+'%'}</div>
    <div class="tiles">`;
  for(let i=1;i<=8;i++){
    const sem = data[semKey(i)];
    const o = semOverall(sem);
    const cls = o===null ? 'dim' : (o>=75 ? 'safe':'risk');
    html += `<div class="tile">
      <div class="t-name">${SEM_LABELS[i-1]}</div>
      <div class="t-pct ${cls}">${o===null ? '—' : o.toFixed(1)+'%'}</div>
      <div class="t-bar"><div class="t-bar-fill" style="width:${o===null?0:Math.min(o,100)}%; background:${o===null?'var(--paper-line)':(o>=75?'var(--stamp-green)':'var(--brick)')};"></div></div>
    </div>`;
  }
  html += `</div>`;
  pb.innerHTML = html;
}

document.getElementById('dashBtn').onclick = () => {
  dashOpen = !dashOpen;
  document.getElementById('passbook').style.display = dashOpen ? 'block':'none';
  document.getElementById('dashBtn').textContent = dashOpen ? 'Hide 4-year dashboard ▴' : 'View 4-year dashboard ▾';
  if(dashOpen) renderDashboard();
};

loadData();
</script>
</body>
</html>
